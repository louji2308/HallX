[project]
name = "hallx"
version = "0.1.0"
description = "HallX-Local: local-first verifiable document adjudication"
readme = "IDEA.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hallx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that require a GPU, a live server, or long-running work",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
